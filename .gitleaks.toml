# gitleaks configuration for ArchLang — a NARROW allowlist for verified false positives.
#
# Read `.gitleaksignore` first: it holds the other half of this story, and its header states
# the division of labour between the two files (dead history → a fingerprint there; a live
# file → an entry here).
#
# ---------------------------------------------------------------------------------------
# WHAT WENT WRONG IN THE FIRST DRAFT, AND WHY THIS FILE IS SHAPED THE WAY IT IS
# ---------------------------------------------------------------------------------------
#
# The first version of this file scoped each exception to a path AND an anchored regex over
# the matched secret, with `matchCondition = "AND"`, on the reasoning that path-alone would
# exempt every future finding in the file. That reasoning was right. The implementation was
# not: **gitleaks 8.30.1 ignores `matchCondition` on a top-level `[[allowlists]]` block and
# ORs the conditions together.** Adding the regex therefore made the allowlist WIDER, not
# narrower — it exempted every 64-hex `generic-api-key` finding *anywhere in the repository*.
#
# That was not caught by reading. It was caught by planting a baseline-shaped 64-hex secret
# in `test/height-free-source.ts` — a file this config does not name — and finding the scan
# still green. Measured, on this tree:
#
#   default rules, no allowlist            6 findings (the 5 real ones + the planted probe)
#   paths + regexes + matchCondition=AND   0 findings   ← the hole: the probe was swallowed
#   paths + targetRules (this file)        1 finding    ← the probe, correctly reported
#
# So the conditions below are PATHS ONLY. One condition cannot be OR-ed into a hole.
#
# ---------------------------------------------------------------------------------------
# WHAT THIS EXEMPTS, AND WHAT IT DOES NOT — state both, or a reader cannot audit it
# ---------------------------------------------------------------------------------------
#
# Exempted: findings of the rule `generic-api-key` ONLY, in the three named files ONLY.
# `targetRules` is what keeps that narrow, and it is load-bearing: a GitHub PAT or a Stripe
# live key pasted into one of these same files is a different rule and is still reported.
# Every other rule, and every other path, is untouched.
#
# NOT exempted by any honest reading: a real `generic-api-key`-shaped credential added to
# one of these three files would now be missed, because gitleaks cannot express the
# path-AND-shape condition this needs. That gap is closed OUTSIDE gitleaks, by
# `test/gitleaks-allowlist.test.ts`, which derives its file list FROM THIS FILE and asserts
# that each one carries only the opaque strings it is supposed to: 64-hex byte-identity
# digests, none at all, and the one published IndexNow key respectively. It runs in
# `npm run check`, so it fails in seconds on a PR rather than overnight.
#
# If you add a path here, add its shape rule to that test in the same commit. An entry here
# without one is a hole with a comment on it.
#
# ---------------------------------------------------------------------------------------
# WHY THESE FIVE FINDINGS ARE FALSE
# ---------------------------------------------------------------------------------------
#
# The nightly secret scan (`.github/workflows/nightly.yml`, job `secrets`) was RED on
# 2026-09-18 and 2026-09-19 on these alone, with every other nightly job green. A
# permanently red gate is a disabled gate that still costs CI minutes: it trains every
# reader to scroll past the one job whose next finding might be real.
#
# 1. THE BYTE-IDENTITY BASELINES — measured SHA-256 digests, not credentials.
#    `docs/agents/iron-laws.md`: every new language form ships with a byte-identity law
#    proved by a SHA-256 sweep over the shipped examples. Those digests ARE the law. They
#    are recorded as `["<example-name>", "<64 hex>"]` rows, so the rule sees a long hex
#    string beside a quoted name and reads the pair as key-and-value. Each is a hash OF
#    PUBLIC OUTPUT — the SVG, `describe()` and `lint()` of a `.arch` file committed in
#    `examples/` — and anyone can recompute every one from this repository. The digest body
#    is `test/byte-identity-digest.ts`.
#
#    Both paths are listed because the scan covers the FULL HISTORY: the tables were
#    extracted from `test/height-byte-identity.test.ts` into `test/byte-identity-baseline.ts`
#    when a second law began importing them, and the historical blob is still scanned at the
#    commit that introduced it.
#
# 2. THE INDEXNOW KEY — public BY PROTOCOL, and useless to whoever takes it.
#    IndexNow authenticates a submitter by requiring the key to be FETCHABLE at the domain
#    root: the search engine reads `https://archlang.uk/<key>.txt` and accepts the
#    submission only if that file is there and contains the key. Publishing it IS the
#    mechanism. The file is committed under `docs-site/public/` and served to the whole
#    internet on purpose; see `scripts/indexnow.mjs` and `docs/seo.md`. What the key permits
#    is asking Bing to re-crawl pages on a domain the holder already controls — no read
#    access, no write access, no account.
#
# The workflow passes `GITLEAKS_CONFIG: .gitleaks.toml` explicitly so that a bare
# `gitleaks detect` run locally and the CI action read this same file.

title = "ArchLang"

# Keep every default rule. A config without this line REPLACES the default rule set with
# the (empty) set defined here, which would silently disable secret scanning entirely —
# the largest possible version of the hole this file is trying not to open.
[extend]
useDefault = true

[[allowlists]]
description = "Measured SHA-256 byte-identity baselines for the example corpus — public digests of public output, not credentials. Shape enforced by test/gitleaks-allowlist.test.ts."
targetRules = ["generic-api-key"]
paths = [
  '''^test/byte-identity-baseline\.ts$''',
  '''^test/height-byte-identity\.test\.ts$''',
]

[[allowlists]]
description = "The public IndexNow verification key — published at the domain root by protocol design. Shape enforced by test/gitleaks-allowlist.test.ts."
targetRules = ["generic-api-key"]
paths = ['''^test/indexnow-script\.test\.ts$''']
