name: apt-debs
description: >-
  Cache the .deb files a job's apt installs download, so the next run of the job reads them from
  the cache instead of a slow Ubuntu mirror. `mode: restore` before the install steps pre-fills
  apt's archive directory; `mode: save` after them stores what apt used. The install commands stay
  as they are: apt uses a pre-placed deb whose name (package_version_arch) and size match the index
  and downloads the rest, so a miss, a partial hit or a stale deb only costs time.

inputs:
  mode:
    description: '"restore" (before the install steps) or "save" (after them).'
    required: true
  set:
    description: >-
      A short name for the job's package set (`chromium`, `engines`, `chromium-ffmpeg`, `all`):
      jobs that install the same packages share it. The save names the restore's set again.
    required: true
  version:
    description: >-
      The resolved Playwright version whose `install-deps` list the set follows (a bump may change
      the packages). Used by `restore` only.
    required: false
    default: ""
  commands:
    description: >-
      The install commands the job runs between restore and save, as one `&&` line (the `install`
      of the set's `apt-cache-warm.yml` row; `test/apt-debs-cache.test.ts` pins them equal). Their
      hash is in the key, so a changed command starts a new cache line. Used by `restore` only.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check the inputs
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        SET: ${{ inputs.set }}
        VERSION: ${{ inputs.version }}
        COMMANDS: ${{ inputs.commands }}
      run: |
        set -euo pipefail
        if [ "$MODE" != restore ] && [ "$MODE" != save ]; then
          echo "::error::apt-debs mode must be restore or save, not '$MODE'"; exit 1
        fi
        if [ -z "$SET" ]; then echo "::error::apt-debs needs set"; exit 1; fi
        if [ "$MODE" = restore ] && { [ -z "$VERSION" ] || [ -z "$COMMANDS" ]; }; then
          echo "::error::apt-debs restore needs version and commands"; exit 1
        fi
        if [ "$MODE" = save ] && [ -n "${APT_DEBS_SET:-}" ] && [ "$SET" != "$APT_DEBS_SET" ]; then
          echo "::error::apt-debs save of set '$SET' after a restore of set '$APT_DEBS_SET'"; exit 1
        fi

    # The base key holds the set, the runner image (a new image may ship other package versions),
    # a hash of the install commands and the Playwright version. A save never writes the base key
    # itself but `<base>_run<run id>-<attempt>`, and the restore looks it up by prefix, newest
    # first: a run whose restored debs were incomplete (apt still downloaded some) saves a newer
    # entry that the next run takes, so an incomplete entry is repaired, never read forever.
    # Failing that, the same commands on another image or Playwright version, then any entry of
    # the set, restore the last debs and apt downloads only what changed. `_` cannot occur in a
    # semver, so one version's prefix never matches another's. ImageOS and ImageVersion are the
    # hosted runner's environment variables, not workflow env, so the key is built in the shell.
    - name: Keep apt's downloads, and build the key
      id: key
      if: inputs.mode == 'restore'
      shell: bash
      env:
        SET: ${{ inputs.set }}
        VERSION: ${{ inputs.version }}
        COMMANDS: ${{ inputs.commands }}
      run: |
        set -euo pipefail
        printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/99-archlang-keep-debs > /dev/null
        hash=$(printf '%s' "$COMMANDS" | sha256sum | cut -c1-12)
        set_prefix="apt-debs-${SET}-${ImageOS:-unknown}-"
        commands_prefix="${set_prefix}${hash}-"
        echo "set-prefix=$set_prefix" >> "$GITHUB_OUTPUT"
        echo "commands-prefix=$commands_prefix" >> "$GITHUB_OUTPUT"
        echo "base=${commands_prefix}${ImageVersion:-unknown}-${VERSION}" >> "$GITHUB_OUTPUT"

    # No entry is ever named `<base>_run` exactly, so the key is a prefix lookup like the first
    # restore key; no lookup is ever an exact hit, and the save decides from what apt did.
    - name: Restore the cached debs
      id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-debs
        key: ${{ steps.key.outputs.base }}_run
        restore-keys: |
          ${{ steps.key.outputs.base }}_run
          ${{ steps.key.outputs.commands-prefix }}
          ${{ steps.key.outputs.set-prefix }}

    - name: Pre-fill apt's archive directory
      if: inputs.mode == 'restore'
      shell: bash
      env:
        SET: ${{ inputs.set }}
        BASE: ${{ steps.key.outputs.base }}
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        eval "$(apt-config shell ARCHIVES Dir::Cache::Archives/d)"
        shopt -s nullglob
        debs=(~/apt-debs/*.deb)
        if [ "${#debs[@]}" -gt 0 ]; then sudo cp -- "${debs[@]}" "$ARCHIVES"; fi
        # What came in, so the save can tell whether apt added anything.
        for d in "${debs[@]}"; do basename "$d"; done | sort > "$RUNNER_TEMP/apt-debs-restored"
        same=false
        case "${MATCHED:-}" in "${BASE}_run"*) same=true ;; esac
        echo "apt-debs: ${#debs[@]} debs into $ARCHIVES from ${MATCHED:-no cache} (this key: $same)"
        echo "APT_DEBS_SET=$SET" >> "$GITHUB_ENV"
        echo "APT_DEBS_KEY=$BASE" >> "$GITHUB_ENV"
        echo "APT_DEBS_MATCHED=${MATCHED:-}" >> "$GITHUB_ENV"

    # Only the debs of packages now installed, at their installed version: a stale version a
    # partial hit restored, or a deb apt fetched for nothing, is not carried forward. When that is
    # exactly what was restored, apt added nothing and nothing is saved: the same lookup finds the
    # same debs next time. Anything else (apt downloaded a deb, or a restored one went stale)
    # saves a new entry under this run's suffix, which the next restore prefers.
    - name: Collect the debs apt used
      id: collect
      if: inputs.mode == 'save'
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${APT_DEBS_KEY:-}" ]; then
          echo "::warning::apt-debs save without a restore in this job; nothing saved"
          echo "save=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        eval "$(apt-config shell ARCHIVES Dir::Cache::Archives/d)"
        # apt names a deb package_version_arch.deb with ':' (an epoch) quoted as %3a, and its arch
        # part may be an arch variant dpkg does not report (amd64v3 for an amd64 package), so the
        # match is on package_version alone.
        dpkg-query -W -f='${Package}_${Version}\n' | sed 's/:/%3a/g' | sort -u > "$RUNNER_TEMP/apt-installed"
        (cd "$ARCHIVES" && find . -maxdepth 1 -name '*.deb' -printf '%f\n' | sort) > "$RUNNER_TEMP/apt-archives"
        awk -F_ 'NR == FNR { keep[$0] = 1; next } ($1 "_" $2) in keep' \
          "$RUNNER_TEMP/apt-installed" "$RUNNER_TEMP/apt-archives" > "$RUNNER_TEMP/apt-keep"
        rm -rf ~/apt-debs
        mkdir -p ~/apt-debs
        while IFS= read -r f; do cp -- "$ARCHIVES/$f" ~/apt-debs/; done < "$RUNNER_TEMP/apt-keep"
        n=$(wc -l < "$RUNNER_TEMP/apt-keep")
        restored=$(wc -l < "$RUNNER_TEMP/apt-debs-restored")
        echo "apt-debs: $n debs ($(du -sh ~/apt-debs | cut -f1)) of $(wc -l < "$RUNNER_TEMP/apt-archives") in $ARCHIVES, $restored restored, for $APT_DEBS_KEY"
        if [ "$n" -eq 0 ]; then
          echo "::warning::apt-debs found no installed package's deb in $ARCHIVES; nothing saved"
          echo "save=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if cmp -s "$RUNNER_TEMP/apt-keep" "$RUNNER_TEMP/apt-debs-restored"; then
          echo "apt-debs: apt added nothing to the $n restored debs; not saving"
          echo "save=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        case "${APT_DEBS_MATCHED:-}" in
          "${APT_DEBS_KEY}_run"*) echo "apt-debs: $APT_DEBS_MATCHED lacked debs apt then downloaded; saving a newer entry" ;;
        esac
        echo "save=true" >> "$GITHUB_OUTPUT"
        echo "key=${APT_DEBS_KEY}_run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    # Sibling shards save the same key at the same time: the loser's save logs that the key is
    # taken and the step still succeeds (the save action only warns, it never fails the job).
    - name: Save the debs
      if: inputs.mode == 'save' && steps.collect.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-debs
        key: ${{ steps.collect.outputs.key }}
