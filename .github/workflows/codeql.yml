name: CodeQL

# Static security analysis of the whole monorepo (core, CLI, generators, sites,
# MCP shim) with CodeQL's default query suite. It runs on every PR and push to
# main so a newly introduced injection/taint path is caught in review, and weekly
# so an *existing* path is re-flagged when GitHub ships new queries — that second
# trigger is the point of the cron, since the code need not change for a query to.

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "docs-site/.vitepress/cache/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "docs-site/.vitepress/cache/**"
  # Required checks on main must also report under the merge queue, or it would wait forever.
  merge_group:
  schedule:
    # Weekly, Monday 04:27 UTC (off the hour so it doesn't queue with the crowd).
    - cron: "27 4 * * 1"

# Least privilege, as in ci.yml: read-only by default, with the one extra scope
# the upload needs granted on the job that needs it.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
      actions: read # read workflow run metadata for the analysis
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          # Nothing to compile for analysis: the core is plain TypeScript and the
          # extractor reads the sources directly, so no `npm ci` / build step.
          build-mode: none
          # DEFAULT query suite on purpose, and nothing excluded: no custom pack,
          # no `paths-ignore` config, no query filters. Tune only in response to a
          # real finding, and say why in the diff.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"

  # On `main`, CodeQL runs in overlay-base mode: it saves the whole JavaScript database (~400 MB) to
  # the Actions cache as `codeql-overlay-base-database-…-<sha>-<run>-<attempt>` on every run and
  # never deletes one. A PR restores only the newest by prefix (and analyses its diff on top, ~80 s
  # instead of ~4 min), so the older entries only crowd the 10 GB repository cache and push the
  # Playwright and apt-debs caches out. This job keeps the newest two per key group (the part before
  # the CodeQL version), so a PR that started restoring just before this run's upload still finds
  # its entry. Not a required check; it touches no other cache and checks out nothing. A key that no
  # longer fits GROUP_RE is never deleted, only warned about, so a change in the action's key shape
  # shows up as a `::warning::` on the run instead of silently stopping the pruning.
  prune-overlay-cache:
    name: Prune CodeQL overlay-base caches
    needs: analyze
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Minimum scope for cache deletion; it also allows workflow dispatch, run cancel/rerun and
      # artifact deletion, none of which this job does.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: "2"
      # `codeql-overlay-base-database-<format>-<hash>-<languages>-`, the key up to the CodeQL version.
      GROUP_RE: "^(?<p>codeql-overlay-base-database-[^-]+-[^-]+-[^-]+-)"
    steps:
      - name: Delete all but the newest overlay-base caches on main
        run: |
          set -euo pipefail
          # The single-quoted filters are jq's, read by gh's built-in jq ($ENV.* is jq, not shell).
          # Newest first by parsed creation time, the fraction trimmed because its length varies (so a
          # string sort can misorder two entries made within the same second), ties broken by the id.
          # shellcheck disable=SC2016
          defs='def grouped: [ .[] | . + {
                  group: ((.key | capture($ENV.GROUP_RE).p) // null),
                  t: (.createdAt | sub("\\.[0-9]+"; "") | fromdateiso8601) } ];
                def groups: map(select(.group != null)) | group_by(.group)
                  | map(sort_by([.t, .id]) | reverse);'
          list() {
            gh cache list --ref refs/heads/main --key codeql-overlay-base-database- \
              --sort created_at --order desc --limit 100 --json id,key,createdAt,sizeInBytes --jq "$defs $1"
          }
          # shellcheck disable=SC2016
          ids=$(list 'grouped | groups | map(.[($ENV.KEEP | tonumber):]) | flatten | .[] | "\(.id) \(.sizeInBytes) \(.key)"')
          if [ -z "$ids" ]; then
            echo "Nothing to prune: at most $KEEP overlay-base caches per group."
          else
            while read -r id size key; do
              echo "Deleting $key ($size bytes)"
              # A concurrent run of this job may have deleted it first: gh's not-found is fine,
              # anything else (a permission error, say) fails the job.
              if ! out=$(gh cache delete "$id" 2>&1); then
                case "$out" in
                  *"Could not find a cache matching"*) echo "Already gone: $id" ;;
                  *) echo "$out" >&2; exit 1 ;;
                esac
              fi
            done <<< "$ids"
          fi
          # Re-read: warn when a key escaped the grouping or a group still holds more than KEEP.
          # shellcheck disable=SC2016
          list 'grouped
            | (.[] | select(.group == null)
                | "::warning::Overlay-base cache key does not match GROUP_RE, so it is never pruned: \(.key)"),
              (groups | .[] | select(length > ($ENV.KEEP | tonumber))
                | "::warning::\(length) overlay-base caches remain in group \(.[0].group) (KEEP=\($ENV.KEEP))")'
