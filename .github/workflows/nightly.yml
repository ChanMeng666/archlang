name: Nightly

# Slow / redundant / external-facing checks that don't belong on the PR path.
#
# CI (ci.yml) gates every push and must stay fast. These are the checks that either
# talk to the outside world (production smoke, advisory feeds), take too long to run
# per-PR (the full OS × Node matrix), or would be pure noise as a merge gate
# (dependency advisories nobody can fix in the PR that tripped them).
#
# Reporting: dependency advisories are REPORT-ONLY — they never turn this workflow red,
# they land in a single pinned issue (marker `<!-- archlang-nightly -->`, the same
# create-or-update mechanic as the bench PR comment in ci.yml). A genuinely broken job
# (`npm ci` failing, a test failing, production down, a leaked secret) DOES fail the
# workflow, and the same issue records which jobs failed.

on:
  schedule:
    # 03:00 UTC — off the deploy path and after any same-day release settles.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Is production actually serving what it promises — right now, not at deploy time?
  # A deploy can go green and the site rot later (a domain/DNS change, an expired
  # cert, a Worker route/custom-domain change, a Cloudflare zone setting that starts
  # rewriting bytes or challenging clients). Same script the deploy uses.
  # ---------------------------------------------------------------------------
  prod-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No `npm ci`: scripts/smoke.mjs is deliberately zero-dependency plain Node.
      - name: Docs site
        run: node scripts/smoke.mjs --site docs --base https://archlang.uk

      - name: Playground
        run: node scripts/smoke.mjs --site playground --base https://playground.archlang.uk

  # ---------------------------------------------------------------------------
  # Dependency advisories + registry signatures. Report-only by design: an advisory
  # published overnight is not a regression in this repo, and a red X nobody can
  # clear teaches people to ignore red X's. `npm ci` breaking IS a real failure.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.audit.outputs.status }}
      report: ${{ steps.audit.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # NOT swallowed — a lockfile that no longer installs is a real, actionable break.
      - name: Install dependencies
        run: npm ci

      - name: Audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit-deps.txt 2>&1
          deps=$?
          npm audit signatures > audit-signatures.txt 2>&1
          sigs=$?
          status=clean
          if [ "$deps" -ne 0 ] || [ "$sigs" -ne 0 ]; then status=advisories; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "report<<NIGHTLY_REPORT_EOF"
            echo "\`npm audit --omit=dev --audit-level=high\` — exit $deps"
            echo ""
            echo '```'
            head -c 3000 audit-deps.txt
            echo ""
            echo '```'
            echo ""
            echo "\`npm audit signatures\` — exit $sigs"
            echo ""
            echo '```'
            head -c 2000 audit-signatures.txt
            echo ""
            echo '```'
            echo "NIGHTLY_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Dependency audit — $status"
            echo '```'
            cat audit-deps.txt audit-signatures.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # ---------------------------------------------------------------------------
  # Secret scanning over the WHOLE history (fetch-depth: 0) — a credential committed
  # and later removed is still leaked, and only a full-history scan sees it.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for individual accounts and public repos; a GITLEAKS_LICENSE is only
          # required for repos owned by a GitHub *organization*. Left unset on purpose.

  # ---------------------------------------------------------------------------
  # Deliberately redundant with ci.yml's Node 18/20/22 matrix — this adds the Windows
  # leg. Path handling and line endings are where an isomorphic, byte-exact compiler
  # gets bitten, and paying for that on every PR isn't worth it; paying for it nightly is.
  # ---------------------------------------------------------------------------
  full-matrix:
    name: Test ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  # ---------------------------------------------------------------------------
  # Read-only end-to-end checks against PRODUCTION (Playwright).
  #
  # `prod-smoke` above proves the routes answer; this proves the sites still WORK —
  # the playground boots and compiles a plan in a real browser, the embed page draws
  # from a `#z=` link, the docs site's machine artifacts are byte-identical to this
  # checkout, and `<ArchLive>` hydrates into a live compiler rather than a dead
  # `<pre>`. ci.yml runs the same specs against a locally BUILT site before merge;
  # this runs a subset against what visitors actually get.
  #
  # Two rules govern this job, and neither is negotiable:
  #
  #   1. READ-ONLY. It drives production, so the run is restricted to `--grep @prod`
  #      — a tag each spec file carries a comment explaining. Tagged cases navigate,
  #      read and assert; nothing downloads, writes the clipboard, submits a form or
  #      depends on persisted state. Never widen this to the full suite.
  #   2. NO BUILD. `E2E_BASE_URL` makes each config drop its `webServer` and point at
  #      the live origin, so there is nothing to build and no preview server — which
  #      is also what makes the docs byte-equality cases meaningful here: they compare
  #      PRODUCTION's bytes against THIS checkout of `main`, i.e. they fail when a
  #      deploy has silently gone stale.
  #
  # A red night here means production is broken or stale, not that a PR is bad — it
  # lands in the same pinned issue the `report` job writes.
  # ---------------------------------------------------------------------------
  e2e-prod:
    name: E2E against production (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22, matching ci.yml's e2e-docs leg: archlive.spec.ts imports the
          # playground's `#z=` decoder, which needs `DecompressionStream("deflate-raw")`
          # (Node ≥ 21.2) at module scope even when the tagged subset never calls it.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NB: no `npm run build`, no site build. With E2E_BASE_URL set, neither config
      # starts a preview server — the specs drive the live origins directly.

      # Keyed on the RESOLVED @playwright/test version: a browser build is pinned
      # to its driver, so a version bump must miss the cache rather than reuse an
      # incompatible download. (Same key as ci.yml's e2e jobs, so a nightly can hit
      # a cache a PR run populated.)
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # On a cache hit the browser binary is already there but the OS packages it
      # links against are not (they live outside the cached path), so the two
      # cases install different things.
      - name: Install Chromium (browser + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps only (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playground — https://playground.archlang.uk
        run: npx playwright test -c playground --grep @prod
        env:
          E2E_BASE_URL: https://playground.archlang.uk

      # `!cancelled()`, not the default: if the playground is down, the docs site's
      # verdict is still worth having tonight. Both still fail the job.
      - name: Docs site — https://archlang.uk
        if: ${{ !cancelled() }}
        run: npx playwright test -c docs-site --grep @prod
        env:
          E2E_BASE_URL: https://archlang.uk

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-prod
          path: |
            playground/playwright-report
            playground/test-results
            docs-site/playwright-report
            docs-site/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # One writer for the pinned issue. Folding "advisories found" and "a job failed"
  # into a single always()-job keeps both out of each other's way: two jobs racing to
  # create-or-update the same issue can create it twice.
  # ---------------------------------------------------------------------------
  report:
    name: Report
    needs: [prod-smoke, audit, secrets, full-matrix, e2e-prod]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update the pinned nightly issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const marker = '<!-- archlang-nightly -->';
            const title = 'Nightly checks need attention';
            const needs = JSON.parse(process.env.NEEDS);
            const { owner, repo } = context.repo;

            const failed = Object.entries(needs)
              .filter(([, job]) => job.result !== 'success' && job.result !== 'skipped')
              .map(([name, job]) => `- \`${name}\` — **${job.result}**`);
            const advisories = needs.audit?.outputs?.status === 'advisories';

            if (failed.length === 0 && !advisories) {
              core.info('nightly: all jobs green and no advisories — nothing to report');
              return;
            }

            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `_Updated by the [nightly workflow](${run}) — ${new Date().toISOString()}._`,
              '',
              failed.length > 0 ? `## Failed jobs\n\n${failed.join('\n')}` : '## Failed jobs\n\nNone — every job passed.',
              '',
              advisories
                ? `## Dependency advisories\n\n${needs.audit.outputs.report}`
                : '## Dependency advisories\n\nNone at `--audit-level=high` for production dependencies.',
              '',
              'Advisories alone never fail the workflow; a failed job does. Close this issue once triaged — the next bad night opens a fresh one.',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => !i.pull_request && (i.body ?? '').includes(marker));

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
              core.info(`updated #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`created #${data.number}`);
            }
